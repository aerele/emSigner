{% extends "templates/web.html" %}

{% block page_content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; padding: 40px 20px; text-align: center;">
	<div style="width: 80px; height: 80px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
		<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
			<polyline points="20 6 9 17 4 12"/>
		</svg>
	</div>
	<h2 style="margin: 0 0 8px 0; color: #333; font-weight: 600;">Document Signed Successfully</h2>
	<p style="margin: 0 0 32px 0; color: #666; font-size: 15px; max-width: 400px;">
		The document has been digitally signed. You can navigate back to the document or close this tab.
	</p>
	{% if doctype and docname %}
	<a href="/app/{{ doctype | e | replace(' ', '-') | lower }}/{{ docname | e }}"
		class="btn btn-primary btn-md" style="border-radius: 6px; padding: 10px 28px; font-size: 14px;">
		Go to Document
	</a>
	{% endif %}
</div>
{% endblock %}
