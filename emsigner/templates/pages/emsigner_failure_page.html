{% extends "templates/web.html" %}

{% block page_content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; padding: 40px 20px; text-align: center;">
	<div style="width: 80px; height: 80px; border-radius: 50%; background: #ffebee; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
		<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
			<line x1="18" y1="6" x2="6" y2="18"/>
			<line x1="6" y1="6" x2="18" y2="18"/>
		</svg>
	</div>
	<h2 style="margin: 0 0 8px 0; color: #333; font-weight: 600;">Signing Failed</h2>
	<p style="margin: 0 0 32px 0; color: #666; font-size: 15px; max-width: 400px;">
		Something went wrong. The document could not be signed. Please try again or contact your administrator.
	</p>
	{% if doctype and docname %}
	<a href="/app/{{ doctype | e | replace(' ', '-') | lower }}/{{ docname | e }}"
		class="btn btn-default btn-md" style="border-radius: 6px; padding: 10px 28px; font-size: 14px;">
		Go to Document
	</a>
	{% endif %}
</div>
{% endblock %}
